[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "customer-analytics"
version = "0.1.0"
description = "Customer analytics demo: churn, LTV and segmentation on DuckDB, queried through a Claude agent."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40",
    "click>=8.1",
    "duckdb>=1.1",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
]

[project.scripts]
ca = "customer_analytics.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
